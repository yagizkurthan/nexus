<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>🤖 Google Gemini AI Agent</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        padding: 20px;
      }

      /* container now used by React root */
      .container {
        width: 100%;
        max-width: 1200px;
        margin: 0 auto;
      }

      .hero {
        height: 60vh;
        display:flex;
        align-items:center;
        justify-content:center;
        position:relative;
        color:#111;
      }

      .hero-card {
        width: 78%;
        background: rgba(255,255,255,0.95);
        border-radius: 16px;
        padding: 28px;
        box-shadow: 0 20px 40px rgba(0,0,0,0.15);
        text-align:center;
      }

      .hero-card h1{font-size:34px;margin-bottom:8px}
      .hero-card p{color:#555;margin-bottom:18px}

      .header h1 {
        font-size: 24px;
        margin-bottom: 5px;
      }

      .header p {
        font-size: 14px;
        opacity: 0.9;
      }

        <div id="root"></div>
      }
        <!-- React via CDN (development) -->
        <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
        <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
        <script src="https://unpkg.com/babel-standalone@6/babel.min.js"></script>

        {% raw %}
        <script type="text/babel">
          const e = React.createElement;

          function Hero({onSend}){
            const [text,setText] = React.useState('');
            return (
              <section className="hero">
                <div className="hero-card">
                  <h1>Build something <span style={{color:'#ff6b6b'}}>Lovable</span></h1>
                  <p>Idea to app in seconds, with your personal full stack engineer</p>
                  <div style={{display:'flex',gap:10,justifyContent:'center',marginTop:16}}>
                    <input value={text} onChange={e=>setText(e.target.value)} placeholder="Ask the agent..." style={{flex:1,padding:14,borderRadius:10,border:'1px solid #ddd'}} />
                    <button className="btn btn-send" onClick={()=>{ onSend(text); setText('');}}>Ask</button>
                  </div>
                </div>
              </section>
            )
          }

          function Chat(){
            const [messages,setMessages] = React.useState([]);
            const [loading,setLoading] = React.useState(false);

            async function send(message){
              if(!message) return;
              const userMsg = {role:'user', text:message, ts: new Date().toISOString()};
              setMessages(m=>[...m,userMsg]);
              setLoading(true);
              try{
                const r = await fetch('/chat',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({message})});
                const j = await r.json();
                const assistant = j.response || j.error || 'No response';
                setMessages(m=>[...m,{role:'assistant', text:assistant, ts:j.timestamp||new Date().toISOString()}]);
              }catch(err){
                setMessages(m=>[...m,{role:'assistant', text:'Error: '+err.message, ts:new Date().toISOString()}]);
              }finally{setLoading(false)}
            }

            return (
              <div style={{display:'flex',gap:20,padding:20}}>
                <div style={{flex:1,background:'#fff',borderRadius:12,boxShadow:'0 8px 24px rgba(0,0,0,0.08)',overflow:'hidden'}}>
                  <div style={{height:420,overflow:'auto',padding:16}}>
                    {messages.length===0 && <div style={{color:'#777'}}>No messages yet.</div>}
                    {messages.map((m,i)=> (
                      <div key={i} style={{marginBottom:12,textAlign: m.role==='user'? 'right':'left'}}>
                        <div style={{display:'inline-block',padding:'8px 12px',borderRadius:10,background: m.role==='user' ? 'linear-gradient(135deg,#667eea,#764ba2)' : '#f6f6f6',color: m.role==='user' ? '#fff' : '#111',maxWidth:'80%'}}>
                          {m.text}
                        </div>
                        <div style={{fontSize:11,opacity:0.6,marginTop:4}}>{new Date(m.ts).toLocaleString()}</div>
                      </div>
                    ))}
                  </div>
                  <div style={{padding:12,borderTop:'1px solid #eee',display:'flex',gap:8}}>
                    <input id="chatInput" placeholder="Type a message..." style={{flex:1,padding:10,borderRadius:8,border:'1px solid #ddd'}} onKeyDown={async (e)=>{if(e.key==='Enter'){await send(e.target.value);e.target.value=''}}} />
                    <button className="btn btn-send" onClick={()=>{const v=document.getElementById('chatInput').value; send(v); document.getElementById('chatInput').value=''}}>Send</button>
                  </div>
                </div>
                <div style={{width:380}}>
                  <DBPanel />
                </div>
              </div>
            )
          }

          function DBPanel(){
            const [dbs,setDbs]=React.useState([]);
            const [selected,setSelected]=React.useState('');
            const [tables,setTables]=React.useState([]);
            const [sheet,setSheet]=React.useState({columns:[],rows:[]});

            React.useEffect(()=>{listDbs()},[]);

            async function listDbs(){
              const r = await fetch('/api/databases'); const j=await r.json(); setDbs(j.databases||[]);
            }

            async function createDb(){
              const name = prompt('New DB name (no extension)'); if(!name) return; const r=await fetch('/api/databases',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({name})}); const j=await r.json(); alert('Status: '+j.status); listDbs();
            }

            async function openDb(db){
              setSelected(db.replace(/\.db$/,''));
              // list tables
              const r = await fetch(`/api/databases/${db.replace(/\.db$/,'')}/tables`); const j=await r.json(); setTables(j.tables||[]);
            }

            async function openTable(t){
              if(!selected) return alert('Select DB first');
              const r = await fetch(`/api/databases/${selected}/tables/${t}/rows`); const j=await r.json();
              const cols = j.columns || (j.rows && j.rows.length ? Object.keys(j.rows[0]) : []);
              setSheet({columns: cols, rows: j.rows || []});
            }

            function editCell(ridx,cidx,val){
              setSheet(s=>{const rows = s.rows.map((r,ri)=> ri===ridx ? {...r,[s.columns[cidx]]: val} : r); return {...s, rows}});
            }

            function addRow(){ setSheet(s=>{ const empty = {}; s.columns.forEach(c=> empty[c]=''); return {...s, rows:[...s.rows, empty]}})}
            function delRow(i){ setSheet(s=>{ const rows = s.rows.filter((_,ri)=>ri!==i); return {...s, rows}})}

            async function saveTable(){
              if(!selected) return alert('Select DB');
              const name = prompt('Table name to save as', 'sheet1'); if(!name) return;
              const payload = {columns: sheet.columns, rows: sheet.rows};
              const r = await fetch(`/api/databases/${selected}/tables/${name}/replace`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload)});
              const j=await r.json(); alert(JSON.stringify(j));
            }

            return (
              <div style={{background:'#fff',padding:12,borderRadius:10,boxShadow:'0 8px 20px rgba(0,0,0,0.06)'}}>
                <h3>Databases</h3>
                <div style={{display:'flex',gap:8,marginBottom:8}}>
                  <select style={{flex:1}} onChange={e=>openDb(e.target.value)}>
                    <option value="">-- select DB --</option>
                    {dbs.map(d=>(<option key={d} value={d}>{d}</option>))}
                  </select>
                  <button className="btn" onClick={createDb}>Create</button>
                </div>
                <div style={{marginBottom:8}}>
                  <strong>Tables</strong>
                  <ul>
                    {tables.map(t=>(<li key={t}><a href="#" onClick={(e)=>{e.preventDefault(); openTable(t)}}>{t}</a></li>))}
                  </ul>
                </div>
                <div>
                  <h4>Sheet</h4>
                  <div style={{maxHeight:220,overflow:'auto',border:'1px solid #eee',padding:8}}>
                    {sheet.columns.length===0 && <div style={{color:'#777'}}>Open a table to view/edit</div>}
                    {sheet.columns.length>0 && (
                      <table style={{width:'100%',borderCollapse:'collapse'}}>
                        <thead><tr>{sheet.columns.map((c,i)=>(<th key={i} style={{borderBottom:'1px solid #ddd',padding:6}}>{c}</th>))}</tr></thead>
                        <tbody>
                          {sheet.rows.map((r,ri)=>(
                            <tr key={ri}>
                              {sheet.columns.map((c,ci)=>(
                                <td key={ci} style={{padding:6,borderBottom:'1px solid #f1f1f1'}} contentEditable suppressContentEditableWarning onBlur={e=>editCell(ri,ci,e.target.textContent)}>{r[c]}</td>
                              ))}
                              <td><button onClick={()=>delRow(ri)}>Del</button></td>
                            </tr>
                          ))}
                        </tbody>
                      </table>
                    )}
                  </div>
                  <div style={{display:'flex',gap:8,marginTop:8}}>
                    <button onClick={addRow} className="btn">Add Row</button>
                    <button onClick={saveTable} className="btn btn-send">Save Table</button>
                  </div>
                </div>
              </div>
            )
          }

          function App(){
            return (
              <div className="container">
                <Hero onSend={(t)=>{document.getElementById('chatInput')&& (document.getElementById('chatInput').value=t); document.getElementById('chatInput')&& document.getElementById('chatInput').dispatchEvent(new KeyboardEvent('keydown',{key:'Enter'}))}} />
                <Chat />
                <section style={{padding:28}}>
                  <h3>From the Community</h3>
                  <div style={{display:'flex',gap:12,marginTop:12}}>
                    <div style={{flex:1,height:120,background:'#fff',borderRadius:10}}></div>
                    <div style={{flex:1,height:120,background:'#fff',borderRadius:10}}></div>
                    <div style={{flex:1,height:120,background:'#fff',borderRadius:10}}></div>
                    <div style={{flex:1,height:120,background:'#fff',borderRadius:10}}></div>
                  </div>
                </section>
              </div>
            )
          }

          ReactDOM.createRoot(document.getElementById('root')).render(<App />)
        </script>
        {% endraw %}
    
        border-radius: 25px;
        font-size: 14px;
        outline: none;
        transition: border-color 0.3s;
      }

      #messageInput:focus {
        border-color: #667eea;
      }

      .btn {
        padding: 12px 24px;
        border: none;
        border-radius: 25px;
        cursor: pointer;
        font-size: 14px;
        font-weight: 600;
        transition: all 0.3s;
      }

      .btn-send {
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        color: white;
      }

      .btn-send:hover {
        transform: translateY(-2px);
        box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
      }

      .btn-send:disabled {
        opacity: 0.5;
        cursor: not-allowed;
        transform: none;
      }

      .btn-clear {
        background: #ff4757;
        color: white;
      }

      .btn-clear:hover {
        background: #ff3838;
      }

      .loading {
        display: none;
        text-align: center;
        padding: 10px;
        color: #667eea;
      }

      .loading.active {
        display: block;
      }

      .loader {
        display: inline-block;
        width: 20px;
        height: 20px;
        border: 3px solid #f3f3f3;
        border-top: 3px solid #667eea;
        border-radius: 50%;
        animation: spin 1s linear infinite;
      }

      @keyframes spin {
        0% {
          transform: rotate(0deg);
        }
        100% {
          transform: rotate(360deg);
        }
      }

      .welcome {
        text-align: center;
        padding: 40px 20px;
        color: #666;
      }

      .welcome h2 {
        color: #667eea;
        margin-bottom: 10px;
      }

      .features {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
        gap: 15px;
        margin-top: 20px;
      }

      .feature {
        background: white;
        padding: 15px;
        border-radius: 10px;
        border: 1px solid #e0e0e0;
      }

      .feature-icon {
        font-size: 24px;
        margin-bottom: 5px;
      }

      .feature-text {
        font-size: 12px;
        color: #666;
      }

      @media (max-width: 600px) {
        .container {
          height: 100vh;
          border-radius: 0;
        }

        .message-content {
          max-width: 85%;
        }
      }
    </style>
  </head>
  <body>
    <div class="container">
      <div class="header">
        <h1>🤖 Google Gemini AI Agent</h1>
        <p>Powered by Gemini 2.0 Flash | 60+ Tools Available</p>
      </div>

      <div class="chat-container" id="chatContainer">
        <div class="welcome">
          <h2>Welcome! 👋</h2>
          <p>I'm an AI agent with 60+ powerful tools. I can help you with:</p>
          <div class="features">
            <div class="feature">
              <div class="feature-icon">📊</div>
              <div class="feature-text">Data Analysis</div>
            </div>
            <div class="feature">
              <div class="feature-icon">🌐</div>
              <div class="feature-text">Web Search</div>
            </div>
            <div class="feature">
              <div class="feature-icon">🧮</div>
              <div class="feature-text">Calculations</div>
            </div>
            <div class="feature">
              <div class="feature-icon">💻</div>
              <div class="feature-text">Code Execution</div>
            </div>
          </div>
        </div>
      </div>

      <div class="loading" id="loading">
        <div class="loader"></div>
        <span>Thinking...</span>
      </div>

      <div class="input-container">
        <input
          type="text"
          id="messageInput"
          placeholder="Type your message here..."
          autocomplete="off"
        />
        <button class="btn btn-send" id="sendBtn" onclick="sendMessage()">
          Send
        </button>
        <button class="btn btn-clear" onclick="clearChat()">Clear</button>
        <button class="btn" id="dbBtn" onclick="openDbPanel()" style="background:#333;color:#fff">Databases</button>
      </div>
    </div>

    <script>
      const chatContainer = document.getElementById("chatContainer");
      const messageInput = document.getElementById("messageInput");
      const sendBtn = document.getElementById("sendBtn");
      const loading = document.getElementById("loading");

      // Enter key to send
      messageInput.addEventListener("keypress", (e) => {
        if (e.key === "Enter" && !e.shiftKey) {
          e.preventDefault();
          sendMessage();
        }
      });

      async function sendMessage() {
        const message = messageInput.value.trim();
        if (!message) return;

        // Add user message to chat
        addMessage(message, "user");
        messageInput.value = "";

        // Disable input while processing
        messageInput.disabled = true;
        sendBtn.disabled = true;
        loading.classList.add("active");

        try {
          const response = await fetch("/chat", {
            method: "POST",
            headers: {
              "Content-Type": "application/json",
            },
            body: JSON.stringify({ message }),
          });

          const data = await response.json();

          if (response.ok) {
            addMessage(data.response, "assistant", data.timestamp);
          } else {
            addMessage(`Error: ${data.error}`, "assistant");
          }
        } catch (error) {
          addMessage(`Error: ${error.message}`, "assistant");
        } finally {
          messageInput.disabled = false;
          sendBtn.disabled = false;
          loading.classList.remove("active");
          messageInput.focus();
        }
      }

      function addMessage(text, sender, timestamp = null) {
        // Remove welcome message
        const welcome = document.querySelector(".welcome");
        if (welcome) welcome.remove();

        const messageDiv = document.createElement("div");
        messageDiv.className = `message ${sender}`;

        const contentDiv = document.createElement("div");
        contentDiv.className = "message-content";

        // Format text (preserve line breaks, code blocks)
        const formattedText = text
          .replace(/```(\w+)?\n([\s\S]*?)```/g, "<pre><code>$2</code></pre>")
          .replace(/\n/g, "<br>");

        contentDiv.innerHTML = formattedText;

        if (timestamp) {
          const timeDiv = document.createElement("div");
          timeDiv.className = "timestamp";
          timeDiv.textContent = new Date(timestamp).toLocaleTimeString();
          contentDiv.appendChild(timeDiv);
        }

        messageDiv.appendChild(contentDiv);
        chatContainer.appendChild(messageDiv);

        // Scroll to bottom
        chatContainer.scrollTop = chatContainer.scrollHeight;
      }

      async function clearChat() {
        if (!confirm("Clear chat history?")) return;

        try {
          await fetch("/clear", { method: "POST" });
          chatContainer.innerHTML = `
                    <div class="welcome">
                        <h2>Chat Cleared! 🔄</h2>
                        <p>Start a new conversation...</p>
                    </div>
                `;
        } catch (error) {
          alert("Error clearing chat: " + error.message);
        }
      }

      // Database panel functions
      function openDbPanel() {
        // create modal if not exists
        if (document.getElementById('dbModal')) {
          document.getElementById('dbModal').style.display = 'block';
          listDatabases();
          return;
        }

        const modal = document.createElement('div');
        modal.id = 'dbModal';
        modal.style.position = 'fixed';
        modal.style.left = '50%';
        modal.style.top = '50%';
        modal.style.transform = 'translate(-50%,-50%)';
        modal.style.background = 'white';
        modal.style.padding = '20px';
        modal.style.borderRadius = '10px';
        modal.style.boxShadow = '0 10px 30px rgba(0,0,0,0.3)';
        modal.style.zIndex = '9999';
        modal.style.width = '720px';
        modal.innerHTML = `
          <h3>Databases</h3>
          <div style="display:flex;gap:8px;margin-bottom:8px">
            <input id="newDbName" placeholder="new-database-name" style="flex:1;padding:8px;border:1px solid #ddd;border-radius:6px" />
            <button onclick="createDatabase()" class="btn btn-send">Create</button>
            <button onclick="closeDbPanel()" class="btn" style="background:#ccc">Close</button>
          </div>
          <div style="display:flex;gap:12px">
            <div style="flex:1">
              <h4>Available DBs</h4>
              <ul id="dbList" style="max-height:240px;overflow:auto;border:1px solid #eee;padding:8px;border-radius:6px"></ul>
            </div>
            <div style="flex:1">
              <h4>SQL Runner</h4>
              <select id="selectedDb" style="width:100%;padding:8px;margin-bottom:8px"></select>
              <textarea id="sqlInput" placeholder="SELECT * FROM table_name LIMIT 50;" style="width:100%;height:120px;padding:8px;border:1px solid #ddd;border-radius:6px"></textarea>
              <button onclick="runSql()" class="btn btn-send" style="margin-top:8px">Run SQL</button>
              <pre id="sqlResult" style="margin-top:8px;background:#f7f7f7;padding:8px;border-radius:6px;height:120px;overflow:auto"></pre>
            </div>
          </div>
        `;
        document.body.appendChild(modal);
        listDatabases();
      }

      function closeDbPanel() {
        const m = document.getElementById('dbModal');
        if (m) m.style.display = 'none';
      }

      async function listDatabases() {
        try {
          const r = await fetch('/api/databases');
          const j = await r.json();
          const ul = document.getElementById('dbList');
          const sel = document.getElementById('selectedDb');
          ul.innerHTML = '';
          sel.innerHTML = '';
          if (j.databases && j.databases.length) {
            j.databases.forEach(db => {
              const li = document.createElement('li');
              li.textContent = db;
              li.style.padding = '6px 4px';
              ul.appendChild(li);

              const opt = document.createElement('option');
              opt.value = db.replace(/\.db$/, '');
              opt.text = db;
              sel.appendChild(opt);
            });
          } else {
            ul.innerHTML = '<em>No databases</em>';
          }
        } catch (e) {
          alert('Error listing DBs: ' + e.message);
        }
      }

      async function createDatabase() {
        const name = document.getElementById('newDbName').value.trim();
        if (!name) return alert('Enter a name');
        try {
          const r = await fetch('/api/databases', {method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({name})});
          const j = await r.json();
          if (j.status) {
            alert('DB ' + j.status);
            document.getElementById('newDbName').value = '';
            listDatabases();
          } else {
            alert('Error: ' + JSON.stringify(j));
          }
        } catch (e) {
          alert('Create error: ' + e.message);
        }
      }

      async function runSql() {
        const db = document.getElementById('selectedDb').value;
        const sql = document.getElementById('sqlInput').value.trim();
        if (!db) return alert('Select DB');
        if (!sql) return alert('Enter SQL');
        try {
          const r = await fetch(`/api/databases/${db}/query`, {method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({sql})});
          const j = await r.json();
          document.getElementById('sqlResult').textContent = JSON.stringify(j, null, 2);
        } catch (e) {
          alert('SQL error: ' + e.message);
        }
      }

      // Focus input on load
      window.addEventListener("load", () => {
        messageInput.focus();
      });
    </script>
  </body>
</html>
