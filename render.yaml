services:
  - type: web
    name: gemini-ai-agent
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app
    envVars:
      - key: GOOGLE_API_KEY
        sync: false
      - key: NEXUS_SECRET_KEY
        sync: false
      - key: PYTHON_VERSION
        value: 3.11.0
